name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write        # requis pour publier la Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YapsonMobile.apk

      - name: Upload APK (artefact, historique)
        uses: actions/upload-artifact@v4
        with:
          name: YapsonMobile-debug-v${{ github.run_number }}
          path: YapsonMobile.apk
          retention-days: 90

      # Lien direct et permanent, installable depuis un telephone sans compte
      # GitHub — meme convention que sms-mirror et yapson-browser.
      - name: Publier sur la Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernier APK
          body: |
            Build #${{ github.run_number }} — ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: YapsonMobile.apk
          make_latest: true
