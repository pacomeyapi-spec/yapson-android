name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          export PATH="/opt/gradle-8.4/bin:$PATH"
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH
          gradle --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YapsonMobile-debug-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Yapson Mobile v${{ github.run_number }}"
          body: |
            ## Yapson Mobile Money - App Android 📱

            ### Télécharger et installer
            1. Télécharge `app-debug.apk` ci-dessous
            2. Sur ton téléphone Android: **Paramètres → Sécurité → Installer depuis sources inconnues** ✓
            3. Installe l'APK
            4. Lance l'app → ⚙️ **Config** → remplis:
               - **URL Backend**: `https://yapson-mobile-backend-production.up.railway.app`
               - **Token**: depuis Admin → Appareils → copier le token
            5. **Autoriser lecture notifications** (pour Wave)
            6. Appuie sur **DÉMARRER** ✅
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
